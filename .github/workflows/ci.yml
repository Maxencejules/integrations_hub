name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ examples/
      - run: ruff format --check src/ tests/ examples/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: integrations_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      IH_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/integrations_hub_test"
      IH_DATABASE_URL_SYNC: "postgresql://postgres:postgres@localhost:5432/integrations_hub_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -v --tb=short
      - name: Verify delivery demonstration
        env:
          IH_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/integrations_hub_demo"
          IH_DATABASE_URL_SYNC: "postgresql://postgres:postgres@localhost:5432/integrations_hub_demo"
        run: |
          python -c "import psycopg2; c = psycopg2.connect(host='localhost', user='postgres', password='postgres', dbname='postgres'); c.autocommit = True; c.cursor().execute('CREATE DATABASE integrations_hub_demo'); c.close()"
          alembic upgrade head
          python examples/delivery_demo.py
